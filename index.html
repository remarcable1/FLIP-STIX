/* FLIP-STIX automatic update check — v37 */
const FLIP_APP_VERSION='39';
(function(){
  if(location.protocol==='file:') return;
  const bust=Date.now();
  fetch('./version.json?cb='+bust,{cache:'no-store'}).then(r=>r.ok?r.json():null).then(async info=>{
    const latest=String(info&&info.version||'');
    if(!latest || latest===FLIP_APP_VERSION) return;

    // A previously installed service worker can otherwise keep serving an old index.html.
    // Remove old workers first, then reload the real index.html with a unique query string.
    try{
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.map(key=>caches.delete(key)));

 una hendidura y el otro debe estar lleno. No pueden encontrarse dos hendiduras ni dos partes llenas.',markersTitle:'Cuadrados grandes y pequeños',markersText:'Los cuadrados grandes y pequeños indican si hay una hendidura en esa posición en el lado correspondiente del palito. Un cuadrado grande representa la cara superior visible; en un palito vertical, es la cara que se ve desde arriba. Un cuadrado pequeño representa la cara inferior oculta; en un palito horizontal, es la cara inferior relevante. Si aparece un cuadrado, hay una hendidura en esa posición; si no aparece, la zona es sólida. Las pequeñas marcas también están presentes en el palito físico en el lado opuesto a una hendidura real. Así, incluso con un palito horizontal, puedes ver desde arriba dónde se encuentra la hendidura de la cara inferior.',visual:'Visualización',visualText:'Los 10 palitos se muestran en su perfil lateral real, con ● arriba y ▲ abajo. Las hendiduras representadas corresponden a las hendiduras de los palitos físicos.',appRole:'Función de la app',appRoleText:'La app es tu libro de reglas y desafíos. El puzzle real se resuelve con el tablero físico FLIP-STIX.',rewardsTitle:'Estrellas y ayudas',rewardsText:'Por cada tarea completada puedes conseguir hasta 3 estrellas: ⭐⭐⭐ sin usar una ayuda, ⭐⭐ con 1 ayuda y ⭐ con 2 ayudas o más. Empiezas con 3 ayudas. Por cada 10 estrellas del Modo Historia que acumules en total, recibes 1 ayuda adicional. Las estrellas dependen del número de ayudas utilizadas en esa tarea; el tiempo que necesites no influye.',rodsIntroNew:'Cada palito se muestra por ambos lados. ● = lado A, ▲ = lado B. 1 significa una muesca; 0 significa macizo.',bothSides:'Lados A + B',sideProfileTitle:'El palito visto de lado',sideProfileText:'El extremo con ● se muestra arriba y el extremo con ▲ abajo. El número del otro extremo identifica el palito. Una muesca aparece como un recorte en el perfil: 0 = macizo, 1 = muesca.',topSurface:'Superficie superior',bottomSurface:'Superficie inferior',sideProfileAria:'Vista lateral de un palito FLIP-STIX con el lado A arriba y el lado B abajo.',chooseColor:'Elegir color para',usedBy:'ya utilizada para',rod:'Palito',standard:'Estándar',horizontal:'Horizontal',vertical:'Vertical',sideA:'Lado A',sideB:'Lado B',visible:'visible desde arriba',pattern:'Patrón',mirrored:'invertido',full:'Lleno',notch:'Hendidura',given:'Dado',hinted:'💡 Ayuda',free:'libre',completed:'completados',chapter:'Abrir niveles',task:'Nivel',tasks:'niveles',open:'Abrir',none:'Aún no hay nada guardado.',help:'💡 Ayuda',hint:'Ayuda',noMore:'No hay más ayudas disponibles.',solve:'¿Completado?',resetTask:'↻ Reiniciar tarea',confirmSolved:'¿Marcar realmente esta tarea como completada?',hurdle:'Reto después de',helpAvailable:'Ayudas disponibles',locked:'Bloqueado',storyStars:'Estrellas del modo historia',storyEnds:'El modo historia termina en el nivel 105.',previous:'Anterior',next:'Siguiente →',inventory:'Inventario de palitos',inventoryNote:'Los palitos dados están fijados; los demás se usan para resolver el puzzle.',saved:'Guardado',favoriteOn:'Guardado en marcadores',favoriteOff:'Marcador eliminado',invalidSave:'Archivo de guardado no válido.',confirmReset:'¿Restablecer la aplicación por completo? Se eliminarán el progreso, las ayudas, los marcadores y los ajustes.',reset:'Progreso restablecido',storyProgress:'Historia',newDifficulty:'Nueva dificultad',hurdleLabel:'Meta',unlocked:'desbloqueado',averageRequired:'se requiere una media de al menos 2 ⭐',boardAria:'Tablero de juego FLIP-STIX',taskResetTitle:'¿Reiniciar nivel?',taskResetText:'Se reiniciarán las ayudas y el estado de completado de este nivel.',yesResetTask:'↻ Sí, reiniciar',cancel:'← Cancelar',completionTitle:'¿Nivel completado?',completionText:'¿Quieres marcar este nivel como completado?',yesCompleted:'✓ Sí, completado',backToTask:'← Volver al nivel',nextTask:'Siguiente nivel →',storyOverview:'☷ Vista de la historia',mainMenu:'⌂ Menú principal',nextTitle:'¡Nivel completado! 🎉',nex let flipNavReady=false;
let flipNavRestoring=false;
let flipCurrentRouteState=null;

// Global back on Android/iOS closes the top-most popup first.
let modalHistoryActive=false;
let modalHistoryClosing=false;
let modalPendingAction=null;

function visibleModals(){
  return Array.from(document.querySelectorAll('.modal-backdrop:not(.hidden)'));
}
function showModal(id,reuseHistory=false){
  const el=document.getElementById(id);
  if(!el)return;
  if(!modalHistoryActive && !reuseHistory){
    const currentState=history.state||{};
    history.pushState({...currentState,__flipStixModal:true},'',location.href);
    modalHistoryActive=true;
  }else if(reuseHistory){
    modalHistoryActive=true;
  }
  el.classList.remove('hidden');
}
function hideModal(id){
  const el=document.getElementById(id);
  if(el)el.classList.add('hidden');
}
function closeModal(id){
  hideModal(id);
  if(visibleModals().length)return;
  if(modalHistoryActive){
    modalHistoryClosing=true;
    history.back();
  }
}
function closeModalKeepHistory(id){
  hideModal(id);
}
function closeModalThen(id,action){
  hideModal(id);
  if(visibleModals().length){
    if(typeof action==='function')action();
    return;
  }
  if(!modalHistoryActive){
    if(typeof action==='function')action();
    return;
  }
  modalPendingAction=typeof action==='function'?action:null;
  modalHistoryClosing=true;
  history.back();
}
function flipRouteSame(a,b){
  if(!a||!b||a.view!==b.view)return false;
  if(a.view==='diff')return a.difficulty===b.difficulty;
  if(a.view==='game')return a.id===b.id;
  if(a.view==='lists')return (a.type||'done')===(b.type||'done');
  return true;
}
function flipNavPush(route){
  if(!flipNavReady || flipNavRestoring) return;
  const currentState=history.state||flipCurrentRouteState||{};
  // Do not create another browser-history entry when the same menu is opened again.
  if(currentState.__flipStixRoute && flipRouteSame(currentState,route)){
    flipCurrentRouteState=currentState;
    return;
  }
  const currentIndex=Number.isFinite(currentState.__flipStixIndex)?currentState.__flipStixIndex:0;
  const nextIndex=currentIndex+1;
  const nextState={...route,__flipStixRoute:true,__flipStixIndex:nextIndex,__flipStixParentIndex:currentIndex};
  history.pushState(nextState,'',location.href);
  flipCurrentRouteState=nextState;
}
function flipNavReplaceGame(route){
  if(!flipNavReady || flipNavRestoring) return;
  const currentState=history.state||flipCurrentRouteState||{};
  if(currentState.__flipStixRoute && currentState.view==='game'){
    const nextState={...currentState,...route,__flipStixRoute:true};
    history.replaceState(nextState,'',location.href);
    flipCurrentRouteState=nextState;
  }else{
    flipNavPush(route);
  }
}
function flipNavRestore(state){
  if(!state||!state.__flipStixRoute) return;
  flipNavRestoring=true;
  try{
    switch(state.view){
      case 'home': flipRestoreMenu('home'); renderHome(); break;
      case 'story': openStory(); break;
      case 'diff': chooseDiff(state.difficulty); break;
      case 'game': if(state.id) openPuzzle(state.id); else { section('home'); renderHome(); } break;
      case 'guide': flipRestoreMenu('guide'); renderGuide(); break;
      case 'rods': flipRestoreMenu('rods'); renderRods(); break;
      case 'settings': flipRestoreMenu('settings'); applyLang(); break;
      case 'lists': openLists(state.type||'done'); break;
      default: section('home'); renderHome();
    }
  }finally{
    flipNavRestoring=false;
  }
}
function flipNavInit(){
  if(flipNavReady) return;
  const initial={...(history.state||{}),__flipStixRoute:true,__flipStixIndex:0,__flipStixParentIndex:null,view:'home'};
  history.replaceState(initial,'',location.href);
  flipCurrentRouteState=initial;
  window.addEventListener('popstate',()=>{
    if(modalHistoryClosing){
      modalHistoryClosing=false;
      modalHistoryActive=false;
      const action=modalPendingAction;
      modalPendingAction=null;
      if(typeof action==='function')action();
      return;
    }
    const modals=visibleModals();
    if(modalHistoryActive && modals.length){
      hideModal(modals[modals.length-1].id);
      modalHistoryActive=false;
      if(visibleModals().length){
        const currentState=history.state||{};
        history.pushState({...currentState,__flipStixModal:true},'',location.href);
        modalHistoryActive=true;
      }
      return;
    }

    const target=history.state||{};
    const from=flipCurrentRouteState||{};
    const parentIndex=Number.isFinite(from.__flipStixParentIndex)?from.__flipStixParentIndex:null;
    const targetIndex=Number.isFinite(target.__flipStixIndex)?target.__flipStixIndex:null;

    // A system back gesture should move one logical menu level, not one
    // browser-history click. If the target is an intermediate history entry,
    // jump directly to the current route's recorded parent.
    if(from.__flipStixRoute && parentIndex!==null && target.__flipStixRoute && targetIndex!==null && targetIndex!==parentIndex){
      const delta=parentIndex-targetIndex;
      if(delta!==0){
        history.go(delta);
        return;
      }
    }

    flipCurrentRouteState=target.__flipStixRoute?target:null;
    flipNavRestore(target);
  });
  flipNavReady=true;
}

const flipScrollPositions={home:0,menu:0,guide:0,rods:0,settings:0,game:0};
function flipVisibleView(){return ['home','menu','guide','rods','settings','game'].find(id=>{const e=document.getElementById(id);return e&&!e.classList.contains('hidden')})||'home'}
function flipSaveScroll(view=flipVisibleView()){flipScrollPositions[view]=window.scrollY||window.pageYOffset||0}
function flipOpenMenu(id){section(id);requestAnimationFrame(()=>window.scrollTo({top:0,left:0,behavior:'auto'}))}
function flipRestoreMenu(id){section(id);requestAnimationFrame(()=>window.scrollTo({top:flipScrollPositions[id]||0,left:0,behavior:'auto'}))}

function applyTheme(){

function setTheme(mode){if(mode!=='light'&&mode!=='dark')mode='light';store.theme=mode;persist();applyTheme()}

function storyPuzzles(){return ['intro','easy','medium','hard','impossible'].flatMap(d=>byDiff[d]||[])}
function storyIndex(p){if(!p)return 0;const order={intro:0,easy:5,medium:30,hard:55,impossible:80};return (order[p.difficulty]??999)+Number(p.level||0)}
function totalStoryStars(){return storyPuzzles().reduce((sum,p)=>sum+(store.done[p.id]?.stars||0),0)}
function earnedStoryStarsThrough(n){return storyPuzzles().filter(p=>storyIndex(p)<=n).reduce((sum,p)=>sum+(store.done[p.id]?.stars||0),0)}
const STORY_HURDLES=[5,15,25,30,40,50,55,65,75,80,90,100];
function hurdleRequiredStars(n){return n===5?0:n*2}
function hurdlePassed(n){
 if(n===5) return storyPuzzles().filter(p=>storyIndex(p)<=5 && store.done[p.id]).length>=5;
 return earnedStoryStarsThrough(n)>=hurdleRequiredStars(n);
}
function hurdleBefore(index){
 let gate=0;
 for(const g of STORY_HURDLES){if(index>g)gate=g;else break}
 return gate;
}
function isStoryUnlocked(p){
 const idx=storyIndex(p);
 if(idx<1||idx>105)return false;
 const gate=hurdleBefore(idx);
 return gate===0||hurdlePassed(gate);
}
function storyGateText(idx){
 const gate=hurdleBefore(idx);
 if(!gate)return '';
 if(gate===5){
   const played=storyPuzzles().filter(p=>storyIndex(p)<=5 && store.done[p.id]).length;
   return `${t('hurdle')} ${gate}: ${played}/5 ${t('tasks')} gespielt`;
 }
 const have=earnedStoryStarsThrough(gate),need=hurdleRequiredStars(gate);
 return `${t('hurdle')} ${gate}: ${have}/${need} ⭐`;
}
function availableHelpCount(){return Math.max(0,3+Math.floor(totalStoryStars()/10)-(Number(store.helpUsed)||0))}
function renderHeaderStars(){const e=document.getElementById('headerStars');if(e)e.innerHTML=`⭐ <b>${totalStoryStars()}</b>`;const h=document.getElementById('headerHelps');if(h)h.innerHTML=`💡 <b>${availableHelpCount()}</b>`;}
function renderHome(){
 renderHeaderStars();
 const story=storyPuzzles(),storyDone=story.filter(p=>store.done[p.id]).length,total=story.length;

function hexToRgb(hex){const m=String(hex).trim().match(/^#?([0-9a-f]{6})$/i);if(!m)return null;return{r:parseInt(m[1].slice(0,2),16),g:parseInt(m[1].slice(2,4),16),b:parseInt(m[1].slice(4,6),16)}
}
function rgbToHex(r,g,b){return '#'+[r,g,b].map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('')}
function rgbToHsv(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360}return[h,mx?d/mx:0,mx]}
function hsvToRgb(h,s,v){const c=v*s,x=c*(1-Math.abs((h/60)%2-1)),m=v-c;let r=0,g=0,b=0;if(h<60)[r,g,b]=[c,x,0];else if(h<120)[r,g,b]=[x,c,0];else if(h<180)[r,g,b]=[0,c,x];else if(h<240)[r,g,b]=[0,x,c];else if(h<300)[r,g,b]=[x,0,c];else[r,g,b]=[c,0,x];return{r:(r+m)*255,g:(g+m)*255,b:(b+m)*255}}
let wheelHSV=[0,1,1];
function setWheelFromHex(hex){const rgb=hexToRgb(hex);if(!rgb)return;wheelHSV=rgbToHsv(rgb.r,rgb.g,rgb.b);updateWheelUI()}
function currentWheelHex(){const rgb=hsvToRgb(...wheelHSV);return rgbToHex(rgb.r,rgb.g,rgb.b).toLowerCase()}
function updateWheelUI(){
 const wheel=document.getElementById('colorWheel'),cursor=document.getElementById('colorWheelCursor'),preview=document.getElementById('colorPreview'),input=document.getElementById('colorHexInput'); if(!wheel)return;
 const [h,s,v]=wheelHSV,rect=wheel.getBoundingClientRect(),size=Math.min(rect.width,rect.height),cx=size/2,cy=size/2,r=size/2,a=(h-90)*Math.PI/180,rr=s*r;
 cursor.style.left=(cx+Math.cos(a)*rr)+'px'; cursor.style.top=(cy+Math.sin(a)*rr)+'px'; const hex=currentWheelHex();
 wheel.style.filter=`brightness(${0.45+v*0.55})`; if(preview)preview.style.background=hex;
 if(input){input.value=hex.toUpperCase();input.classList.remove('invalid')}
 const vs=document.getElementById('colorValueSlider'),ss=document.getElementById('colorSaturationSlider'); if(vs)vs.value=Math.round(v*100); if(ss)ss.value=Math.round(s*100);
}
function syncColorSliders(){
 const vs=document.getElementById('colorValueSlider'),ss=document.getElementById('colorSaturationSlider'),input=document.getElementById('colorHexInput');
 if(vs)vs.oninput=()=>{wheelHSV[2]=Number(vs.value)/100;updateWheelUI()};
 if(ss)ss.oninput=()=>{wheelHSV[1]=Number(ss.value)/100;updateWheelUI()};
 if(input){input.oninput=()=>{const rgb=hexToRgb(input.value);if(!rgb){input.classList.add('invalid');return}input.classList.remove('invalid');wheelHSV=rgbToHsv(rgb.r,rgb.g,rgb.b);updateWheelUI()};input.onblur=()=>{if(!hexToRgb(input.value)){input.value=currentWheelHex().toUpperCase();input.classList.remove('invalid')}}}
}
function setWheelFromPointer(e){const wheel=document.getElementById('colorWheel'),rect=wheel.getBoundingClientRect();let x=e.clientX-rect.left-rect.width/2,y=e.clientY-rect.top-rect.height/2;const r=rect.width/2,dist=Math.min(Math.hypot(x,y),r);wheelHSV[0]=(Math.atan2(y,x)*180/Math.PI+450)%360;wheelHSV[1]=dist/r;updateWheelUI()}
function closeColorWheel(){closeModal('colorWheelModal')}
function confirmColorWheel(){
 const modal=document.getElementById('colorWheelModal'),rodIndex=Number(modal?.dataset.rodIndex||-1); if(rodIndex<0||rodIndex>=10)return;
 const input=document.getElementById('colorHexInput'),rgb=hexToRgb(input?.value||''); if(!rgb){if(input){input.classList.add('invalid');input.focus()}return}
 const color=rgbToHex(rgb.r,rgb.g,rgb.b).toLowerCase();
 const other=store.colors.findIndex((c,i)=>i!==rodIndex&&String(c||'').toLowerCase()===color);
 if(other!==-1){toast(`${t('chooseColor')} ${t('rod')} ${other+1}`);return}
 store.colors[rodIndex]=color; persist(); renderColorSettings(); renderRods();
 if(!document.getElementById('guide').classList.contains('hidden'))renderGuide();
 closeColorWheel();
 if(current&&!document.getElementById('game').classList.contains('hidden')){drawBoard();drawInventory()}
}

(function initColorWheel(){document.addEventListener('DOMContentLoaded',()=>{const wheel=document.getElementById('colorWheel');if(!wheel)return;let drag=false;wheel.addEventListener('pointerdown',e=>{drag=true;wheel.setPointerCapture?.(e.pointerId);setWheelFromPointer(e)});wheel.addEventListener('pointermove',e=>{if(drag)setWheelFromPointer(e)});wheel.addEventListener('pointerup',()=>drag=false);wheel.addEventListener('pointercancel',()=>drag=false);});})();

function exportSave(){const payload={exportedAt:new Date().toISOString(),lang,store};const text='FLIP-STIX SAVE\n'+btoa(unescape(encodeURIComponent(JSON.stringify(payload))));const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:'text/plain'}));a.download=`${t('saveFilePrefix').replace(/\s+/g,'_')}.txt`;a.click();toast(t('export'))}
function importSave(){const input=document.createElement('input');input.type='file';input.accept='.txt,text/plain';input.onchange=()=>{const f=input.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const m=String(r.result).match(/^FLIP-STIX SAVE(?: v(?:85|86|87|88|89|90|91|92|93|94|95|96|97|98|99|100|101|102|103|104|105|106|107|108|109|110|111|112|113|114|115|116|117|118|119|120|121|122|123|124|125|126|127|128|129|130|131|132|133|134|135|136|137|138|139|140|141|142|143))?\n(.+)$/s);if(!m)throw 0;const p=JSON.parse(decodeURIComponent(escape(atob(m[1]))));store=p.store||{done:{},fav:{}};store.done=store.done||{};store.fav=store.fav||{};store.colors=(store.colors&&store.colors.length===10)?store.colors:DEFAULT_COLORS.slice();store.customPalette=(store.customPalette&&store.customPalette.length===10)?store.customPalette:CUSTOM_DEFAULTS.map(v=>v[0]);lang=p.lang||lang;persist();applyLang();toast(t('import'))}catch(e){alert(t('invalidSave'))}};r.readAsText(f)};input.click()}
